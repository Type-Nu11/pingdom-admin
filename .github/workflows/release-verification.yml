name: Release verification

on:
  pull_request:
    branches: [develop, release]
  push:
    branches: [develop, release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Prepare browser verification output
        shell: bash
        run: echo "PINGDOM_QA_OUTPUT=$RUNNER_TEMP/pingdom-browser-qa" >> "$GITHUB_ENV"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm test
      - run: npm run test:release-browser
      - name: Browser verification summary
        if: always()
        shell: bash
        run: |
          if [ -f "$PINGDOM_QA_OUTPUT/summary.json" ]; then
            echo 'Synthetic Chromium regression only; real-server/device/deployment QA remains separate.' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "$PINGDOM_QA_OUTPUT/summary.json" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
