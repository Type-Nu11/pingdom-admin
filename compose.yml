name: pingdom-admin
services:
  web:
    image: pingdom-admin:${PINGDOM_IMAGE_TAG:?Set a unique release tag}
    build:
      context: .
      args:
        VITE_PUBLIC_API_BASE_URL: /api
        VITE_APP_BASE_PATH: ${VITE_APP_BASE_PATH:-/operator/}
        VITE_NAVER_MAP_CLIENT_ID: ${VITE_NAVER_MAP_CLIENT_ID:?Set the public NAVER Maps Client ID}
    ports:
      # Required web host port. An app gateway on the same host must not also bind 8082.
      # 별도 프록시 EC2가 접근할 때만 웹 EC2의 VPC 내부 IP로 설정합니다.
      - "${PINGDOM_WEB_BIND_ADDRESS:-127.0.0.1}:${PINGDOM_WEB_PORT:-8082}:8080"
    environment:
      # Must point at the authenticated WEB gateway, never the raw backend.
      PINGDOM_API_UPSTREAM: ${PINGDOM_API_UPSTREAM:-host.docker.internal:8081}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
